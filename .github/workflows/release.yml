name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, asset: dsaudio-linux-x86_64, mcp: dsaudio-mcp-linux-x86_64, ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-22.04-arm, asset: dsaudio-linux-arm64, mcp: dsaudio-mcp-linux-arm64, ext: tar.gz }
          - { name: macos-x86_64, os: macos-13, asset: dsaudio-macos-x86_64, mcp: dsaudio-mcp-darwin-x86_64, ext: tar.gz }
          - { name: macos-arm64, os: macos-14, asset: dsaudio-macos-arm64, mcp: dsaudio-mcp-darwin-arm64, ext: tar.gz }
          - { name: windows-x86_64, os: windows-2022, asset: dsaudio-windows-x86_64, mcp: dsaudio-mcp-windows-x86_64, ext: zip }

    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libasound2-dev libx11-dev libgl1-mesa-dev xvfb

      - name: Windows curl (vcpkg)
        if: startsWith(matrix.os, 'windows')
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" | Out-Null
          echo "CMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure and build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build all targets
        run: cmake --build build --config Release -j2

      # The release must not ship code that fails the tests.
      - name: Core tests
        run: ctest --test-dir build --output-on-failure

      - name: macOS app bundle
        if: startsWith(matrix.os, 'macos')
        run: bash scripts/build_mac.sh Release

      - name: Package Unix
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == macos-* ]]; then
            tar -czf dist/${{ matrix.asset }}.tar.gz -C build dsaudio.app
          else
            tar -czf dist/${{ matrix.asset }}.tar.gz -C build dsaudio
          fi
          tar -czf dist/${{ matrix.mcp }}.tar.gz -C build dsaudio-mcp
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)

      - name: Package Windows
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          mkdir -p dist
          7z a dist/${{ matrix.asset }}.zip build/Release/dsaudio.exe
          7z a dist/${{ matrix.mcp }}.zip build/Release/dsaudio-mcp.exe
          (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Version
        id: v
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"
          echo "build=$(tr -d '[:space:]' < BUILD_NUMBER.txt)" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## dsaudio ${{ steps.v.outputs.version }} (build ${{ steps.v.outputs.build }})

          DeepSeek TTS and ASR in one C application: a native workbench, a CLI and
          an MCP server, sharing one core.

          ### Install the MCP server

          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | sh
          \`\`\`

          Windows: \`irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex\`

          ### Assets

          | Asset | What it is |
          |---|---|
          | \`dsaudio-mcp-<os>-<arch>.tar.gz\` / \`.zip\` | MCP server, self-contained |
          | \`dsaudio-<os>-<arch>.tar.gz\` / \`.zip\` | GUI workbench (macOS ships a signed \`.app\`) |

          Every archive has a SHA-256 sidecar. Linux needs libcurl and libasound at
          runtime; Windows and macOS ship everything they need.

          ### Verify

          \`\`\`sh
          dsaudio-mcp --selftest
          dsaudio-cli config
          \`\`\`

          ### What this build was tested on

          The CI ran, on every platform: the offline core test suite, the MCP
          JSON-RPC request path, the CLI key resolution, and a real window launch
          on Linux under Xvfb.
          EOF

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
