name: macos

# macOS runners are capacity-starved: a queued leg there blocks a shared matrix
# for tens of minutes. This workflow is therefore separate and on demand —
# run it by hand when you want the macOS slices, or on a schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, off-peak
  push:
    paths: ["src/**", "CMakeLists.txt", "vendor/**"]

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14, arch: arm64 }
          # Intel slice, cross-built on the arm64 runner; runs under Rosetta 2.
          - { name: macos-x86_64, os: macos-14, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
      - name: Build
        run: cmake --build build --config Release -j2
      - name: CI gate
        run: scripts/ci-test.sh
      - name: App bundle
        run: bash scripts/build_mac.sh Release
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.name }}
          path: |
            build/dsaudio.app
            build/dsaudio-mcp
