name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, arch: x86_64 }
          - { name: linux-arm64, os: ubuntu-22.04-arm, arch: arm64 }
          - { name: windows-x86_64, os: windows-2022, arch: x86_64 }
          # macOS lives in .github/workflows/macos.yml: its runners are
          # capacity-starved and a queued leg blocks the whole pipeline.

    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libasound2-dev libx11-dev libgl1-mesa-dev \
            xvfb xauth

      - name: Windows curl (vcpkg manifest mode)
        if: startsWith(matrix.os, 'windows')
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" | Out-Null
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP\vcpkg\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch || 'arm64' }}

      - name: Build
        run: cmake --build build --config Release -j2

      # The gate: pure logic, offline, every platform.
      - name: CI gate
        shell: bash
        run: scripts/ci-test.sh
      - name: Package the binaries
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        run: |
          mkdir -p dist
          tar -czf dist/dsaudio-linux-x86_64.tar.gz -C build dsaudio dsaudio-cli dsaudio-mcp
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        with:
          name: bin-linux-x86_64
          path: dist/dsaudio-linux-x86_64.tar.gz

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fail-${{ matrix.name }}
          path: |
            build/**/CMakeCache.txt
            build/**/*.log
          if-no-files-found: ignore

  # A different libc, not another glibc LTS: musl differs in pthread and in the
  # libc extensions it omits, which is what containers actually ship.
  test-linux-musl:
    name: linux-musl
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.24
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: apk add --no-cache build-base cmake samurai curl-dev alsa-lib-dev libx11-dev linux-headers
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
      - name: Build
        run: cmake --build build -j2
      - name: CI gate
        run: scripts/ci-test.sh

  # The binary built on the oldest LTS must run on a newer one; that is the claim
  # a user actually depends on, and it costs one runner instead of three builds.
  run-linux-2404:
    name: run-on-24.04
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bin-linux-x86_64
          path: bin
      - name: Runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4 libasound2t64 xvfb
      - name: Run the 22.04-built binaries
        run: |
          tar -xzf bin/dsaudio-linux-x86_64.tar.gz -C bin
          ./bin/dsaudio-mcp --selftest | head -c 120; echo
          HOME="$PWD/.ci-home" ./bin/dsaudio-cli config | head -2
          xvfb-run -a env DSAUDIO_QUIT_AFTER=6 ./bin/dsaudio
